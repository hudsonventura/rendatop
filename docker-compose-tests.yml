services:

  db-test:
    image: postgres:18
    container_name: rendatop-test-db
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-test:
    image: redis:7
    container_name: rendatop-test-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12



  tests:
    build:
      context: ./
      dockerfile: ./tests/Dockerfile
    container_name: rendatop-tests
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db-test
      - REDIS_HOST=redis-test:6379
      - WHATSAPP_EVOLUTION_URL=http://10.10.1.202:8080
      - NOTIFICATION_TESTS_MANAGED_BY_COMPOSE=true
      - WHATSAPP_TEST_PHONE=65992327494
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    restart: "no"
