services:

  db:
    image: postgres:18
    container_name: rendatop-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    
  redis:
    image: redis:7
    container_name: rendatop-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data


  evolution:
    container_name: evolution_api
    image: atendai/evolution-api:v2.2.3
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./.data/evolution:/evolution/instances


  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rendatop-server
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - WHATSAPP_EVOLUTION_URL=http://evolution:8080
      - REDIS_HOST=redis:6379
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      - db
      - redis
    ports:
      - "5000:5000"
    
  migrator:
    build:
      context: ./
      dockerfile: ./migrator/Dockerfile
    container_name: rendatop-migrator
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      - db
    restart: "no"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rendatop-client
    restart: always
    depends_on: 
      - server
    expose:
      - "4173"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: rendatop-nginx
    restart: always
    depends_on:
      - client
      - server
    ports:
      - "80:80"
    

  landing:
    build:
      context: ./landing/nextjs-version
      dockerfile: Dockerfile
    container_name: rendatop-landing
    restart: always
    ports:
      - "3001:3000"
    
