services:

  db:
    image: postgres:18
    container_name: rendatop-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    



  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rendatop-api
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    depends_on: 
      - db
    ports:
      - "5000:5000"
    

  front:
    build:
      context: ./front/vite-version
      dockerfile: Dockerfile
    container_name: rendatop-front
    restart: always
    env_file:
      - .env
    depends_on: 
      - api
    ports:
      - "3000:80"
    

  landing:
    build:
      context: ./landing/nextjs-version
      dockerfile: Dockerfile
    container_name: rendatop-landing
    restart: always
    ports:
      - "3001:3000"
    

