services:

  db:
    image: postgres:18
    container_name: rendatop-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    
  redis:
    image: redis:7
    container_name: rendatop-redis
    restart: always
    volumes:
      - ./.data/redis:/data


  # evolution:
  #   container_name: evolution_api
  #   image: atendai/evolution-api:v2.2.3
  #   restart: always
  #   ports:
  #     - "8080:8080"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - db
  #     - redis
  #   volumes:
  #     - ./.data/evolution:/evolution/instances

  whatsapp-wwebjs:
    image: avoylenko/wwebjs-api:v1.34.6
    container_name: rendatop-whatsapp-wwebjs
    restart: always
    env_file:
      - .env
    environment:
      - API_KEY=${WHATSAPP_WWEBJS_API_KEY}
      - ENABLE_WEBHOOK=FALSE
      - ENABLE_LOCAL_CALLBACK_EXAMPLE=FALSE
    volumes:
      - ./.data/wwebjs:/usr/src/app/sessions
    ports:
      - "3000:3000"


  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rendatop-server
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - WHATSAPP_EVOLUTION_URL=http://evolution:8080
      - WHATSAPP_WWEBJS_URL=http://whatsapp-wwebjs:3000
      - REDIS_HOST=redis:6379
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      - db
      - redis
    
  migrator:
    build:
      context: ./
      dockerfile: ./migrator/Dockerfile
    container_name: rendatop-migrator
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      - db
    restart: "no"

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    container_name: rendatop-client
    restart: always
    depends_on: 
      - server

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: rendatop-nginx
    restart: always
    depends_on:
      - landing
      - client
      - server
    ports:
      - "80:80"
    

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: rendatop-landing
    env_file:
      - .env
    depends_on: 
      - server
    restart: always
    
