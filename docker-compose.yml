services:

  db:
    image: postgres:18
    container_name: rendatop-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    
  redis:
    image: redis:7
    container_name: rendatop-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data


  evolution:
    container_name: evolution_api
    image: atendai/evolution-api:v2.2.3
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./.data/evolution:/evolution/instances


  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rendatop-server
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - WHATSAPP_EVOLUTION_URL=http://evolution:8080
      - REDIS_HOST=redis:6379
    depends_on:
      db:
        condition: service_started
      migrations-applier:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    
  migrations-applier:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: rendatop-migrations-applier
    working_dir: /app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_started
    volumes:
      - ./:/app
    command: ["dotnet", "run", "--project", "migrations-applier/migrations-applier.csproj"]
    restart: "no"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rendatop-client
    restart: always
    env_file:
      - .env
    depends_on: 
      - server
    ports:
      - "3000:80"
    

  landing:
    build:
      context: ./landing/nextjs-version
      dockerfile: Dockerfile
    container_name: rendatop-landing
    restart: always
    ports:
      - "3001:3000"
    
