services:

  db:
    image: postgres:18
    container_name: rendatop-test-db
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: rendatop-test-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  evolution:
    image: atendai/evolution-api:v2.2.3
    container_name: rendatop-test-evolution
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/evolution?schema=public
      - CACHE_REDIS_URI=redis://redis:6379/6
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  tests:
    build:
      context: ./
      dockerfile: ./tests/Dockerfile
    container_name: rendatop-tests
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis:6379
      - WHATSAPP_EVOLUTION_URL=http://evolution:8080
      - NOTIFICATION_TESTS_MANAGED_BY_COMPOSE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution:
        condition: service_started
    restart: "no"
