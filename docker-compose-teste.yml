services:

  db:
    image: postgres:18
    container_name: rendatop-test-db
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: rendatop-test-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  tests:
    build:
      context: ./
      dockerfile: ./tests/Dockerfile
    container_name: rendatop-tests
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis:6379
      - WHATSAPP_EVOLUTION_URL=${WHATSAPP_EVOLUTION_URL_PROD}
      - WHATSAPP_EVOLUTION_INSTANCE=${WHATSAPP_EVOLUTION_INSTANCE_PROD}
      - WHATSAPP_EVOLUTION_API_KEY=${WHATSAPP_EVOLUTION_API_KEY_PROD}
      - NOTIFICATION_TESTS_MANAGED_BY_COMPOSE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
